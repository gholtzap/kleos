<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kleos helps professionals show what they actually did, how they contributed, and what evidence supports their work."
    />
    <meta name="theme-color" content="#f3f0e8" />
    <link rel="icon" href="/kleos-icon.svg" type="image/svg+xml" />
    <title>Kleos — Proof of work, professionally</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Paints the dark app surface before the bundle parses, for a browser
      // that was last signed in. Without it the first frame is the light
      // landing background and every load into the app starts with a white
      // flash. src/hooks/use-app-surface.ts writes and clears the hint.
      try {
        if (localStorage.getItem("kleos.surface") === "app") {
          document.documentElement.dataset.surface = "app";
          document.querySelector('meta[name="theme-color"]').content = "#000000";
        }
      } catch (error) {
        // Storage can be unavailable; the light first paint is the fallback.
      }
    </script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
