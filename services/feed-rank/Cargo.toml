[package]
name = "kleos-feed-ranker"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "kleos_feed_ranker"
path = "src/lib.rs"

[[bin]]
name = "kleos-feed-ranker"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
